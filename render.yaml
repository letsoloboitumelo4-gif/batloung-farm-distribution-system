services:
  - type: web
    name: batloung-farm-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: FRONTEND_URL
        value: https://batloung-farm-web.onrender.com

  - type: web
    name: batloung-farm-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://batloung-farm-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
